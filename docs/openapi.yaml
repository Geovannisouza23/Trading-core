openapi: 3.0.3
info:
  title: Trading Core API
  description: >
    Operational core of an automated trading robot, running in PAPER mode by
    default. See docs/architecture.md for the full system design.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      summary: Readiness probe (checks the database connection)
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }

  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain: {}

  /v1/dashboard:
    get:
      summary: Full trading dashboard snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/account:
    get:
      summary: Current account state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/positions:
    get:
      summary: Open positions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/orders:
    get:
      summary: Recent orders
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/orders/{id}:
    get:
      summary: Get a single order by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/signals:
    get:
      summary: Recent trade signals
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Signal" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/risk-decisions:
    get:
      summary: Recent risk decisions
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RiskDecision" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/events:
    get:
      summary: Recent market events
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/incidents:
    get:
      summary: Recent system incidents
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/system/pause:
    post:
      summary: Pause trading (blocks new entries, keeps monitoring/reconciliation running)
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/system/resume:
    post:
      summary: Resume trading in the deployment's configured mode (PAPER/TESTNET only — REAL can never be reached through this endpoint)
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/system/close-only:
    post:
      summary: Enter CLOSE_ONLY mode (only reducing/closing positions is allowed)
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/system/kill-switch:
    post:
      summary: Activate the kill switch (blocks all new entries; overrides every other mode)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillSwitchRequest" }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/paper/reset:
    post:
      summary: Reset the PAPER account, PaperBroker ledger, and any open positions/orders to a fresh starting state (PAPER mode only)
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/backtest/request:
    post:
      summary: Submit a backtest job to quant-engine (real gRPC call — see docs/decisions/0010-real-grpc-client-for-quant-engine.md)
      description: >
        Requires QUANT_MODE=grpc; returns a structured error in fake mode
        (there is no meaningful fake backtest). The caller supplies the
        candle window to evaluate — trading-core does not fetch historical
        data on its own behalf, same as quant-engine's own gRPC contract.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BacktestRequest" }
      responses:
        "202":
          description: Backtest accepted, running asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/backtest/{id}:
    get:
      summary: Poll a backtest job's result
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Backtest status, and metrics/trades/equity curve once completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/backtest/{id}/stream:
    get:
      summary: Follow a backtest job's progress over Server-Sent Events
      description: Closes after the job reaches a terminal status, same as the underlying StreamBacktestProgress RPC.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: text/event-stream of BacktestProgress JSON payloads
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/optimization/request:
    post:
      summary: Submit a hyperparameter search job to quant-engine
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OptimizationRequest" }
      responses:
        "202":
          description: Optimization accepted, running asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/optimization/{id}:
    get:
      summary: Poll an optimization job's result
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Optimization status, and best/top candidate results once completed
          content:
            application/json:
              schema: { type: object, description: "See output.GetOptimizationResultResult (Go) for the exact shape." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/dataset/export:
    post:
      summary: Trigger a Parquet dataset export on quant-engine
      description: There is no dedicated poll RPC for this job kind on the wire contract — only the initial status is available.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetExportRequest" }
      responses:
        "202":
          description: Export accepted, running asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/strategy/validate:
    post:
      summary: Ask quant-engine whether a strategy name/version/params combination is valid and usable
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateStrategyRequest" }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { type: object, description: "See output.ValidateStrategyResult (Go) for the exact shape." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/quant/features:
    post:
      summary: Ask quant-engine to compute the v1 feature vector for a candle window
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculateFeaturesRequest" }
      responses:
        "200":
          description: Computed features and a data-quality report
          content:
            application/json:
              schema: { type: object, description: "See output.CalculateFeaturesResult (Go) for the exact shape." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/quant/model/evaluate:
    post:
      summary: Run a model directly against an already-computed feature vector
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateModelRequest" }
      responses:
        "200":
          description: Model prediction
          content:
            application/json:
              schema: { type: object, description: "See output.ModelPrediction (Go) for the exact shape." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/quant/model/reload:
    post:
      summary: Validate and reload the APPROVED/CANARY/PRODUCTION model for a stage
      description: Validates the registry state/hash for the requested stage; does not itself perform a hot-swap (see quant-engine's docs/model-inference.md).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReloadApprovedModelRequest" }
      responses:
        "200":
          description: Reload result
          content:
            application/json:
              schema: { type: object, description: "See output.ReloadApprovedModelResult (Go) for the exact shape." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/quant/feature-schema:
    get:
      summary: Read the canonical v1 feature schema, or a specific version
      parameters:
        - { name: version, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Feature schema
          content:
            application/json:
              schema: { type: object, description: "See output.GetFeatureSchemaResult (Go) for the exact shape." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/quant/model-metadata:
    get:
      summary: Read model registry metadata (never writes it)
      parameters:
        - { name: model_name, in: query, required: false, schema: { type: string } }
        - { name: model_version, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Model metadata
          content:
            application/json:
              schema: { type: object, description: "See output.GetModelMetadataResult (Go) for the exact shape." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/decisions/{decision_id}/outcome:
    post:
      summary: Report the realized outcome of a decision back to quant-engine for training-data purposes
      description: >
        The outcome is caller-supplied in this delivery — trading-core does
        not yet auto-trigger this from order reconciliation (see
        docs/decisions/0010-real-grpc-client-for-quant-engine.md).
      parameters:
        - { name: decision_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDecisionOutcomeRequest" }
      responses:
        "200":
          description: Outcome accepted
          content:
            application/json:
              schema: { type: object, description: "See output.RegisterDecisionOutcomeResult (Go) for the exact shape." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT with a "roles" claim (array of strings). Read-only /v1/*
        GET endpoints accept any authenticated role; POST /v1/system/*,
        /v1/paper/reset, and every /v1/backtest, /v1/optimization,
        /v1/dataset, /v1/strategy, /v1/quant, and /v1/decisions/*/outcome
        endpoint require "operator" or "admin".

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1 }

  requestBodies:
    Reason:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }

  responses:
    Status:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StatusResponse" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated but missing the required role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Invalid request or operation not allowed in the current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    ReadyResponse:
      type: object
      properties:
        status: { type: string, example: ready }
        error: { type: string }

    ReasonRequest:
      type: object
      properties:
        reason: { type: string }

    KillSwitchRequest:
      type: object
      properties:
        reason: { type: string }
        allow_close: { type: boolean }

    JobAccepted:
      type: object
      properties:
        backtest_id: { type: string, description: "present on the backtest response" }
        optimization_id: { type: string, description: "present on the optimization response" }
        export_id: { type: string, description: "present on the dataset export response" }
        status: { type: string, enum: [UNSPECIFIED, QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }

    CandleRequest:
      type: object
      description: One OHLCV bar. Trading-core does not fetch historical candles on the caller's behalf — the caller supplies the window to evaluate, same as quant-engine's own gRPC contract.
      required: [open_time, close_time, open, high, low, close, volume]
      properties:
        open_time: { type: string, format: date-time }
        close_time: { type: string, format: date-time }
        open: { type: string, description: "decimal-as-string, never a float" }
        high: { type: string }
        low: { type: string }
        close: { type: string }
        volume: { type: string }

    BacktestConfigRequest:
      type: object
      required: [symbol, timeframe, strategy_name, from, to]
      properties:
        symbol: { type: string }
        timeframe: { type: string }
        strategy_name: { type: string }
        strategy_version: { type: string }
        strategy_params: { type: object, additionalProperties: { type: string } }
        initial_capital: { type: string }
        fee_rate: { type: string }
        slippage: { type: string }
        execution_model: { type: string, enum: [CLOSE_PRICE, NEXT_OPEN, OHLC, CONSERVATIVE] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        allow_short: { type: boolean }
        model_name: { type: string, description: "optional — empty means no model in the loop" }
        model_version: { type: string }
        generate_training_records: { type: boolean }

    BacktestRequest:
      type: object
      required: [config, candles]
      properties:
        config: { $ref: "#/components/schemas/BacktestConfigRequest" }
        candles:
          type: array
          items: { $ref: "#/components/schemas/CandleRequest" }

    BacktestResult:
      type: object
      description: metrics/trades/equity_curve mirror quant-engine's BacktestMetrics/TradeRecord/EquityPoint wire messages field for field (decimal values stay strings) — see output.GetBacktestResultResult (Go) for the exact shape.
      properties:
        backtest_id: { type: string }
        status: { type: string, enum: [UNSPECIFIED, QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }
        metrics: { type: object }
        trades: { type: array, items: { type: object } }
        equity_curve: { type: array, items: { type: object } }
        error_message: { type: string }
        completed_at: { type: string, format: date-time }

    ParameterRangeRequest:
      type: object
      description: Either min/max/step (continuous) or choices (discrete) — mutually exclusive.
      properties:
        name: { type: string }
        min: { type: string }
        max: { type: string }
        step: { type: string }
        choices: { type: array, items: { type: string } }

    OptimizationRequest:
      type: object
      required: [base_config, search_space]
      properties:
        base_config: { $ref: "#/components/schemas/BacktestConfigRequest" }
        candles:
          type: array
          items: { $ref: "#/components/schemas/CandleRequest" }
        search_space:
          type: array
          items: { $ref: "#/components/schemas/ParameterRangeRequest" }
        algorithm: { type: string, enum: [GRID, RANDOM] }
        objective: { type: string, enum: [NET_PROFIT, PROFIT_FACTOR, SHARPE, SORTINO, MIN_DRAWDOWN, RISK_ADJUSTED_RETURN, STABILITY] }
        max_iterations: { type: integer }
        walk_forward: { type: boolean }
        walk_forward_windows: { type: integer }
        monte_carlo: { type: boolean }
        monte_carlo_runs: { type: integer }

    DatasetExportRequest:
      type: object
      required: [dataset_name, dataset_version]
      properties:
        dataset_name: { type: string }
        dataset_version: { type: string }
        symbols: { type: array, items: { type: string } }
        timeframes: { type: array, items: { type: string } }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        label_version: { type: string }

    ValidateStrategyRequest:
      type: object
      required: [strategy_name]
      properties:
        strategy_name: { type: string }
        strategy_version: { type: string }
        params: { type: object, additionalProperties: { type: string } }

    CalculateFeaturesRequest:
      type: object
      required: [symbol, timeframe]
      properties:
        symbol: { type: string }
        timeframe: { type: string }
        candles:
          type: array
          items: { $ref: "#/components/schemas/CandleRequest" }
        feature_schema_version: { type: string, description: "optional pin; empty = current" }

    FeatureValueRequest:
      type: object
      description: Exactly one of numeric_value/categorical_value/bool_value is meaningful, selected by kind.
      properties:
        name: { type: string }
        kind: { type: string, enum: [numeric, categorical, bool] }
        numeric_value: { type: string }
        categorical_value: { type: string }
        bool_value: { type: boolean }

    EvaluateModelRequest:
      type: object
      required: [model_name, features]
      properties:
        model_name: { type: string }
        model_version: { type: string, description: "optional; empty = active/production version" }
        features:
          type: array
          items: { $ref: "#/components/schemas/FeatureValueRequest" }
        feature_schema_version: { type: string }

    RegisterDecisionOutcomeRequest:
      type: object
      properties:
        order_created: { type: boolean }
        executed: { type: boolean }
        rejection_reason: { type: string, description: "populated when order_created == false" }
        entry_price: { type: string }
        exit_price: { type: string }
        quantity: { type: string }
        fees: { type: string }
        slippage: { type: string }
        pnl: { type: string }
        exit_reason: { type: string }
        entry_at: { type: string, format: date-time }
        exit_at: { type: string, format: date-time }

    ReloadApprovedModelRequest:
      type: object
      required: [model_name, stage]
      properties:
        model_name: { type: string }
        stage: { type: string, enum: [APPROVED, CANARY, PRODUCTION] }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: INVALID_OPERATION_MODE }
            message: { type: string }
            details: { type: object }
            request_id: { type: string }

    Account:
      type: object
      properties:
        id: { type: string }
        balance: { type: string }
        equity: { type: string }
        available_balance: { type: string }
        peak_equity: { type: string }
        daily_pnl: { type: string }
        weekly_pnl: { type: string }
        current_drawdown: { type: string }
        operational_mode: { type: string, enum: [PAPER, TESTNET, REAL, PAUSED, CLOSE_ONLY, KILL_SWITCH] }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    Position:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: string }
        entry_price: { type: string }
        current_price: { type: string }
        stop_price: { type: string, nullable: true }
        target_price: { type: string, nullable: true }
        unrealized_pnl: { type: string }
        realized_pnl: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        version: { type: integer }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    Order:
      type: object
      properties:
        id: { type: string }
        client_order_id: { type: string }
        broker_order_id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        type: { type: string, enum: [MARKET, LIMIT, STOP_MARKET, STOP_LIMIT] }
        quantity: { type: string }
        filled_quantity: { type: string }
        requested_price: { type: string, nullable: true }
        average_execution_price: { type: string, nullable: true }
        stop_price: { type: string, nullable: true }
        target_price: { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, SUBMITTED, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED, FAILED, UNKNOWN]
        strategy_name: { type: string }
        signal_id: { type: string }
        risk_decision_id: { type: string }
        failure_reason: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Signal:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        entry_price: { type: string }
        stop_price: { type: string }
        target_price: { type: string }
        confidence: { type: string }
        strategy_name: { type: string }
        market_regime: { type: string, enum: [TRENDING, RANGE_BOUND, VOLATILE, UNKNOWN] }
        created_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }

    RiskDecision:
      type: object
      properties:
        id: { type: string }
        signal_id: { type: string }
        allowed: { type: boolean }
        original_position_size: { type: string }
        approved_position_size: { type: string }
        reason_codes: { type: array, items: { type: string } }
        applied_rules: { type: array, items: { type: string } }
        event_restrictions: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    MarketEvent:
      type: object
      properties:
        id: { type: string }
        event_type: { type: string }
        direction: { type: string, enum: [BULLISH, BEARISH, NEUTRAL] }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        confidence: { type: string }
        affected_assets: { type: array, items: { type: string } }
        action: { type: string, enum: [NORMAL, REDUCE, BLOCK_NEW_ENTRIES, REVIEW_REQUIRED, KILL_SWITCH] }
        source_count: { type: integer }
        has_official_source: { type: boolean }
        published_at: { type: string, format: date-time }
        detected_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, EXPIRED, RESOLVED] }

    Incident:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        description: { type: string }
        source: { type: string }
        related_entity_id: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        detected_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolution: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Dashboard:
      type: object
      properties:
        account: { $ref: "#/components/schemas/Account" }
        positions: { type: array, items: { $ref: "#/components/schemas/Position" } }
        open_orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        recent_signals: { type: array, items: { $ref: "#/components/schemas/Signal" } }
        recent_risk_decisions: { type: array, items: { $ref: "#/components/schemas/RiskDecision" } }
        active_events: { type: array, items: { $ref: "#/components/schemas/MarketEvent" } }
        active_incidents: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        integrations:
          type: object
          properties:
            broker_healthy: { type: boolean }
            quant_engine_healthy: { type: boolean }
            llm_healthy: { type: boolean }
        operational_mode: { type: string }
        last_reconciliation_at: { type: string, format: date-time, nullable: true }
