# api/worker also join `aegis-net`, an external network shared with
# sibling repos (quant-engine) — `docker network create aegis-net` once,
# before `docker compose up` in either repo. NATS_URL/REDIS_ADDR below
# resolve `nats`/`redis` by the exact service names quant-engine's own
# docker-compose.yml gives them — this repo does not run a second,
# isolated NATS/Redis. See docs/decisions/0011-real-nats-client-and-redis.md
# and README.md for the one-time setup step. Both are optional (falls
# back to the in-memory event bus / no cache) if quant-engine's stack
# isn't up.
x-app-env: &app-env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USER: trading
  DATABASE_PASSWORD: trading
  DATABASE_NAME: trading_core
  DATABASE_SSL_MODE: disable
  BROKER_MODE: PAPER
  BROKER_PAPER_STARTING_BALANCE: "10000"
  LLM_PROVIDER: noop
  QUANT_MODE: fake
  NATS_URL: nats://nats:4222
  NATS_REQUIRED: "false"
  REDIS_ADDR: redis:6379
  REDIS_REQUIRED: "false"
  OBSERVABILITY_SERVICE_NAME: trading-core
  OBSERVABILITY_ENVIRONMENT: docker-compose
  OBSERVABILITY_LOG_LEVEL: info
  OBSERVABILITY_LOG_FORMAT: json
  # CHANGE THIS before exposing the API beyond local docker-compose.
  SECURITY_JWT_SIGNING_SECRET: "docker-compose-dev-secret-change-me-please-32chars"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_core
    ports:
      - "5432:5432"
    volumes:
      - trading_core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_core"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [trading_core]

  migrate:
    build: .
    command: ["/usr/local/bin/migrate", "up"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [trading_core]

  api:
    build: .
    command: ["/usr/local/bin/api"]
    environment: *app-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [trading_core, aegis-net]

  worker:
    build: .
    command: ["/usr/local/bin/worker"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [trading_core, aegis-net]

networks:
  trading_core:
  aegis-net:
    external: true

volumes:
  trading_core_pgdata:
